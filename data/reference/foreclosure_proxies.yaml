# Public-proxy registry — what PUBLIC evidence can foreclose each innocent
# explanation, so the foreclosure gate must TRY before declaring
# `cannot_close_pre_filing`.
#
# Doctrine (2026-07-26): every org case to date died on `innocent_foreclosed`,
# and in several the gate declared an explanation unresolvable WITHOUT
# attempting retrieval that public data actually supports (the CO EVV path, the
# Lab Ebony peer-cohort test, the MDCareNow same-specialty distribution). This
# registry makes the attempt mandatory and checkable: each taxonomy_tag lists
# the public sources that bear on it, whether we hold them locally, and the
# exact command/URL. `decisive` = can fully foreclose; `partial` = narrows only.
#
# HONEST BOUNDARY: some explanations genuinely need non-public facts (charts,
# EVV logs, payroll). Those are marked `truly_non_public: true` — for those the
# gate SHOULD say cannot_close_pre_filing, and that is a real referral, not a
# failure. The point is to stop conceding the ones we CAN close.

proxies:
  large_clinical_staff_workforce_410_26:
    closes: "A large incident-to clinical staff furnished the billed time"
    sources:
      - name: PECOS reassignment roster (individual->org edges)
        local: data/processed/pecos_reassignment.parquet
        how: "count distinct individual NPIs reassigning benefits to the target's org/TIN"
        strength: decisive
      - name: NPPES org size / authorized official
        local: data/registries/nppes_bulk.parquet
        how: "python scripts/entity_lookup.py npi <NPI> (co_members + entity roster)"
        strength: partial
      - name: T-MSIS servicing-NPI roster
        local: data/raw/medicaid/provider_spending_full.parquet
        how: "python scripts/entity_lookup.py npi <NPI> -> servicing.as_billing_org_staff"
        strength: partial
        caveat: "org self-report is common; empty != no staff (validated 2026-07-16)"
    truly_non_public: false

  peer_norm:
    closes: "Same-specialty/co-located peers bill this way too"
    sources:
      - name: Same-specialty national cohort count
        local: data/panels/cms_partb_svc_<year>.parquet
        how: "python scripts/cohort_screen_count.py --year <Y> --where \"<screen>\" --specialty \"<spec>\""
        strength: decisive
        note: "REQUIRED before accepting any 'this is typical' claim — a percentile
               against the WRONG cohort has twice produced a false benign read
               (Red Sun PCS class; MDCareNow behavioral E&M)."
      - name: Co-located peers
        local: data/registries/nppes_bulk.parquet
        how: "python scripts/address_sweep.py --npi <NPI>"
        strength: partial
    truly_non_public: false

  panel_acuity:
    closes: "My patients are sicker (dual/disabled/high-risk panel explains the coding)"
    sources:
      - name: Case-mix-matched peer cohort (same specialty, panels at least as young/poor)
        local: data/panels/cms_partb_<year>.parquet
        how: "python scripts/casemix_cohort.py --npi <NPI> --year <Y> --code <HCPCS>
              [--u65-min 0.5 --dual-min 0.5]  # band mode = the foreclosure claim;
              default subject-anchored mode = sensitivity check (small-n tail is
              contaminated by other outliers — read numbers, not just the tag)"
        strength: decisive
        note: "VALIDATED 2026-08-02 (CALIBRATION-B3C661FF Aspen): defense said no
               case-mix-conditioned cohort exists; band cohort n=1,810 equally-sick FP
               panels had median 99215 penetration 0.0% vs subject 81.1% (rank 6,
               p99.7) -> foreclose_explanation, case proceeded. Works both directions:
               a subject inside the matched pack is a cheap pre-run DECLINE."
    truly_non_public: false

  specialty_case_mix:
    closes: "This specialty legitimately concentrates in the flagged codes"
    sources:
      - name: NPPES taxonomy vs billed-code family (scope match)
        local: data/registries/nppes_bulk.parquet
        how: "python scripts/mo_signatures.py --npi <NPI>  -> scope_mismatch"
        strength: partial
      - name: Same-taxonomy code-mix distribution
        local: data/panels/cms_partb_svc_<year>.parquet
        how: "cohort_screen_count with --specialty; compare target's mix to the cohort"
        strength: decisive
    truly_non_public: false

  unqualified_or_unlicensed_staff:
    closes: "Staff were properly licensed/credentialed"
    sources:
      - name: State licensure lookup (per-state board site)
        local: null
        how: "WebFetch the state board license-verification page for named staff"
        strength: partial
      - name: FSMB / state board actions
        local: data/processed/state_board_actions_fsmb.parquet
        how: "join NPI/name against board-action rows"
        strength: partial
      - name: LEIE + CMS revocations
        local: data/processed/leie.parquet, revoked_medicare_providers.parquet
        how: "python scripts/leie_lookup.py <NPI>"
        strength: decisive
    truly_non_public: false

  coding_transition_artifact:
    closes: "The jump is a CPT/HCPCS revision, not behavior"
    sources:
      - name: HCPCS effective dates + descriptor history
        local: data/ground_truth/hcpcs_level2_full.parquet
        how: "python scripts/hcpcs_lookup.py --code <C> --year <Y>"
        strength: decisive
    truly_non_public: false

  individualized_medical_necessity:
    closes: "Each patient individually warranted the max-tier/broad service"
    sources:
      - name: Coverage-rule condition (LCD/NCD/Article)
        local: data/reference/coverage_anchors.yaml
        how: "python scripts/lcd_lookup.py --hcpcs <C> --effective-on <date>; fraudlib.anchors"
        strength: partial
        note: "The ANCHOR establishes individualization as a condition of payment
               (confirmed_false_claim), but does NOT by itself foreclose that each
               patient qualified — that needs the order-control question below."
      - name: Order-control test (does the target ORDER and RENDER?)
        local: data/panels/cms_partb_svc_<year>.parquet
        how: "mo_signatures orders_and_renders / em_share — a pass-through lab does
              NOT control the order (tier 2); an integrated clinic does (tier 3)"
        strength: decisive
        note: "The Lab Ebony A/B discriminator (2026-07-19)."
    truly_non_public: false

  bona_fide_group_practice:
    closes: "The alleged co-conspirator is a real group colleague"
    sources:
      - name: PECOS reassignment / shared TIN
        local: data/processed/pecos_reassignment.parquet
        how: "shared reassignment group between the two NPIs"
        strength: decisive
      - name: Corporate registry (state SOS open data)
        local: null
        how: "WebFetch the state SOS business-entity API (e.g. data.colorado.gov)"
        strength: partial
    truly_non_public: false

  # ── genuinely non-public: the gate SHOULD decline these ─────────────────
  services_were_actually_rendered:
    closes: "The visits/hours billed really happened"
    sources:
      - name: State EVV records (personal care / home health)
        local: null
        how: "state records request (CORA/FOIA) — NON-PUBLIC"
        strength: decisive
    truly_non_public: true
    note: "Edgewater/CO-cluster class. Correct outcome = REFERRAL, not a forced FILE."

  per_patient_chart_necessity:
    closes: "Each individual chart documents medical necessity"
    sources:
      - name: Medical records
        local: null
        how: "CID / discovery — NON-PUBLIC"
        strength: decisive
    truly_non_public: true
    note: "Reserve for discovery; under a representative-claim theory this is a
           damages-quantification item, not a pleading prerequisite."
