# ---------------------------------------------------------------------------
# vocabulary — canonical vs DEPRECATED terms/artifacts (the non-script analogue
# of `entries` above; the authoritative "use this, not that" map). Pre-commit
# guard #7 (scripts/verify_vocabulary.py) blocks NEWLY-ADDED `deprecated` phrases
# in current-surface files (docs, console .jsx, README, agent prompts, web/, .py
# comments/strings). It scans only ADDED diff lines, so existing legacy mentions
# never block — it just stops NEW drift. History/why-deprecated docs are exempt.
# Bypass a legitimate historical mention with:  ALLOW_VOCAB_DRIFT=1 git commit ...
# ---------------------------------------------------------------------------
vocabulary:
  "labels": {use: "gold_set.jsonl — DOJ-only labels, loaded by fraudlib/labels/v4_gold.py", deprecated: ["v9 label", "v9 corpus", "v9 ground truth", "v9 row", "v9 positive", "v9-stamped", "cases_v1"]}
  "panel_filter": {use: "floor_0.50 — data-fit panel filter in walk_forward_v4.py::_agent_filter_drop_mask", deprecated: ["59-rule v3 agent filter", "59-rule agent filter", "59 rule agent filter", "rules_v3 agent filter", "rules_v3 filter"]}
  "rule_features": {use: "rules_v3.json = FEATURE columns only (rule__*); NOT the panel filter, NOT the rule-derivation output", deprecated: []}
  "rule_derivation": {use: "experimental tool — proposes NEW candidate rules from new features; NOT the canonical filter", deprecated: []}
  "doj_ingest": {use: "Corpus Curator (pipeline/scrapers/doj_press_releases.py -> gold_set_builder.py)", deprecated: ["doj_api_ingest is canonical", "canonical doj_api_ingest"]}
  "label_policy": {use: "DOJ-only labels", deprecated: ["leie label", "leie as truth", "leie as a label"]}
